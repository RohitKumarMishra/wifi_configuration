name: wifi_configuration
description: >-
  Connect Android and iOS devices to a Wi-Fi network, read the current SSID,
  and list available networks. Null-safe and Dart 3 compatible.
version: 2.0.0
homepage: https://github.com/RohitKumarMishra/wifi_configuration
repository: https://github.com/RohitKumarMishra/wifi_configuration
issue_tracker: https://github.com/RohitKumarMishra/wifi_configuration/issues
topics:
  - wifi
  - network
  - android
  - ios

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rohitkrmishra.wifi_configuration
        pluginClass: WifiConfigurationPlugin
      ios:
        pluginClass: WifiConfigurationPlugin
